name: Publish GHCR Images

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag, for example v1.3.0"
        required: true
        type: string
      source_owner:
        description: "GitHub owner/org containing the AutoStream source repositories"
        required: true
        type: string
      control_panel_version:
        description: "Control Panel source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      discord_bot_version:
        description: "Discord Bot source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      encoder_recorder_version:
        description: "Encoder Recorder source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      observability_version:
        description: "Observability source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      worker_version:
        description: "Worker source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      push_images:
        description: "Push images to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  SOURCE_OWNER: ${{ inputs.source_owner || github.repository_owner }}
  PUSH_IMAGES: ${{ github.ref_type == 'tag' || inputs.push_images }}
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/Autostream-Docker

jobs:
  publish:
    name: Build image (${{ matrix.component.service }} ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        component:
          - service: control-panel
            repo: Autostream-ControlPanel
            dockerfile: services/control-panel/Dockerfile
          - service: discord-bot
            repo: Autostream-DiscordBot
            dockerfile: services/discord-bot/Dockerfile
          - service: encoder-recorder
            repo: Autostream-Encoder-Recorder
            dockerfile: services/encoder-recorder/Dockerfile
          - service: observability
            repo: Autostream-Observability
            dockerfile: services/observability/Dockerfile
          - service: worker
            repo: Autostream-Worker
            dockerfile: services/worker/Dockerfile
        target:
          - platform: linux/amd64
            arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2404
          - platform: linux/arm64
            arch: arm64
            runner: blacksmith-16vcpu-ubuntu-2404-arm

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VERSION}" =~ ^v\. ]]; then
            echo "::error::Version must look like v1.3.0, not ${VERSION}. Remove the dot after v." >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.3.0; got ${VERSION}" >&2
            exit 1
          fi

      - name: Checkout Dockerfiles
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: dockerfiles

      - name: Resolve source version
        id: source_version
        shell: bash
        run: |
          set -euo pipefail
          source_version=""
          case "${{ matrix.component.service }}" in
            control-panel) source_version="${{ inputs.control_panel_version }}" ;;
            discord-bot) source_version="${{ inputs.discord_bot_version }}" ;;
            encoder-recorder) source_version="${{ inputs.encoder_recorder_version }}" ;;
            observability) source_version="${{ inputs.observability_version }}" ;;
            worker) source_version="${{ inputs.worker_version }}" ;;
          esac
          if [[ -z "${source_version}" && -f dockerfiles/source-versions.env ]]; then
            # shellcheck disable=SC1091
            source dockerfiles/source-versions.env
            case "${{ matrix.component.service }}" in
              control-panel) source_version="${CONTROL_PANEL_SOURCE_VERSION:-}" ;;
              discord-bot) source_version="${DISCORD_BOT_SOURCE_VERSION:-}" ;;
              encoder-recorder) source_version="${ENCODER_RECORDER_SOURCE_VERSION:-}" ;;
              observability) source_version="${OBSERVABILITY_SOURCE_VERSION:-}" ;;
              worker) source_version="${WORKER_SOURCE_VERSION:-}" ;;
            esac
          fi
          if [[ -z "${source_version}" ]]; then
            source_version="${VERSION}"
          fi
          if [[ "${source_version}" =~ ^v\. ]]; then
            echo "::error::Source version must look like v1.3.0, not ${source_version}. Remove the dot after v." >&2
            exit 1
          fi
          if [[ ! "${source_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Source version must look like v1.3.0; got ${source_version}" >&2
            exit 1
          fi
          echo "source_version=${source_version}" >> "${GITHUB_OUTPUT}"
          echo "Using ${{ matrix.component.repo }} source tag ${source_version} for image ${VERSION} on ${{ matrix.target.platform }}."

      - name: Verify source access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOSTREAM_SOURCE_TOKEN || secrets.GITHUBTOKEN || github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${SOURCE_OWNER}/${{ matrix.component.repo }}" >/dev/null; then
            echo "::error::Cannot access ${SOURCE_OWNER}/${{ matrix.component.repo }}. Set AUTOSTREAM_SOURCE_TOKEN or GITHUBTOKEN with read access to the private source repositories." >&2
            exit 1
          fi
          if ! gh api "repos/${SOURCE_OWNER}/${{ matrix.component.repo }}/git/ref/tags/${{ steps.source_version.outputs.source_version }}" >/dev/null; then
            echo "::error::Missing source tag ${{ steps.source_version.outputs.source_version }} in ${SOURCE_OWNER}/${{ matrix.component.repo }}. If service versions differ, set the matching *_version workflow input or update source-versions.env." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ env.SOURCE_OWNER }}/${{ matrix.component.repo }}
          ref: ${{ steps.source_version.outputs.source_version }}
          path: source/${{ matrix.component.repo }}
          token: ${{ secrets.AUTOSTREAM_SOURCE_TOKEN || secrets.GITHUBTOKEN || github.token }}

      - name: Resolve build metadata
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$(git -C "source/${{ matrix.component.repo }}" rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - uses: useblacksmith/setup-docker-builder@47a5d0102cc44712a17a633c2599f755008cc40e # v1
        with:
          max-cache-size-mb: "10240"

      - name: Login to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN || github.token }}

      - name: Compute image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="$(printf '%s' "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${image_namespace}/${{ matrix.component.service }}"
          {
            echo "tags<<EOF"
            echo "${image}:${VERSION}-${{ matrix.target.arch }}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally push
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: source/${{ matrix.component.repo }}
          file: dockerfiles/${{ matrix.component.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.source_version.outputs.source_version }}
            COMMIT=${{ steps.build_meta.outputs.source_commit }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
          labels: |
            org.opencontainers.image.title=AutoStream ${{ matrix.component.service }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.build_meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_OWNER }}/${{ matrix.component.repo }}

  publish-manifest:
    name: Publish manifest (${{ matrix.component.service }})
    needs: publish
    if: ${{ github.ref_type == 'tag' || inputs.push_images }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        component:
          - service: control-panel
          - service: discord-bot
          - service: encoder-recorder
          - service: observability
          - service: worker

    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN || github.token }}

      - name: Compute image ref
        id: image_ref
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="$(printf '%s' "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${image_namespace}/${{ matrix.component.service }}" >> "${GITHUB_OUTPUT}"

      - name: Publish version manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image_ref.outputs.image }}"
          docker buildx imagetools create \
            -t "${image}:${VERSION}" \
            "${image}:${VERSION}-amd64" \
            "${image}:${VERSION}-arm64"

      - name: Publish latest manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            image="${{ steps.image_ref.outputs.image }}"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${VERSION}-amd64" \
              "${image}:${VERSION}-arm64"
          else
            echo "Skipping latest for non-stable version ${VERSION}."
          fi
