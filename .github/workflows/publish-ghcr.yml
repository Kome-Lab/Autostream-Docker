name: Publish GHCR Images

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag, for example v1.3.0"
        required: true
        type: string
      source_owner:
        description: "GitHub owner/org containing the AutoStream source repositories"
        required: true
        type: string
      control_panel_version:
        description: "Control Panel source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      discord_bot_version:
        description: "Discord Bot source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      encoder_recorder_version:
        description: "Encoder Recorder source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      observability_version:
        description: "Observability source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      worker_version:
        description: "Worker source tag. Blank uses source-versions.env, then version."
        required: false
        default: ""
        type: string
      push_images:
        description: "Push images to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: autostream-docker-${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  SOURCE_OWNER: ${{ inputs.source_owner || github.repository_owner }}
  PUSH_IMAGES: ${{ github.ref_type == 'tag' || inputs.push_images }}
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/Autostream-Docker

jobs:
  release-preflight:
    name: Refuse mutable release targets
    permissions:
      contents: read
      packages: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Validate immutable version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.3.0; got ${VERSION}" >&2
            exit 1
          fi

      - name: Refuse an existing GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}")"
          case "${status}" in
            404) ;;
            200)
              echo "::error::GitHub Release ${VERSION} already exists; immutable releases are never modified." >&2
              exit 1
              ;;
            *)
              echo "::error::Could not prove that GitHub Release ${VERSION} is absent (HTTP ${status})." >&2
              exit 1
              ;;
          esac

      - name: Login to GHCR for immutable tag checks
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN || github.token }}

      - name: Refuse existing GHCR tags
        if: env.PUSH_IMAGES == 'true'
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(printf '%s' "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          for service in control-panel discord-bot encoder-recorder observability worker; do
            for suffix in '' '-amd64' '-arm64'; do
              ref="${REGISTRY}/${namespace}/${service}:${VERSION}${suffix}"
              set +e
              output="$(docker manifest inspect "${ref}" 2>&1)"
              inspect_status=$?
              set -e
              if [[ "${inspect_status}" -eq 0 ]]; then
                echo "::error::GHCR tag ${ref} already exists; immutable image tags are never overwritten." >&2
                exit 1
              fi
              if ! grep -Eqi 'manifest unknown|no such manifest|not found' <<<"${output}"; then
                echo "::error::Could not prove that GHCR tag ${ref} is absent." >&2
                echo "${output}" >&2
                exit 1
              fi
            done
          done

  publish:
    name: Build image (${{ matrix.component.service }} ${{ matrix.target.arch }})
    needs: release-preflight
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        component:
          - service: control-panel
            repo: Autostream-ControlPanel
            dockerfile: services/control-panel/Dockerfile
          - service: discord-bot
            repo: Autostream-DiscordBot
            dockerfile: services/discord-bot/Dockerfile
          - service: encoder-recorder
            repo: Autostream-Encoder-Recorder
            dockerfile: services/encoder-recorder/Dockerfile
          - service: observability
            repo: Autostream-Observability
            dockerfile: services/observability/Dockerfile
          - service: worker
            repo: Autostream-Worker
            dockerfile: services/worker/Dockerfile
        target:
          - platform: linux/amd64
            arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2404
          - platform: linux/arm64
            arch: arm64
            runner: blacksmith-16vcpu-ubuntu-2404-arm

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VERSION}" =~ ^v\. ]]; then
            echo "::error::Version must look like v1.3.0, not ${VERSION}. Remove the dot after v." >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.3.0; got ${VERSION}" >&2
            exit 1
          fi

      - name: Checkout Dockerfiles
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: dockerfiles

      - name: Resolve source version
        id: source_version
        shell: bash
        env:
          CONTROL_PANEL_INPUT: ${{ inputs.control_panel_version }}
          DISCORD_BOT_INPUT: ${{ inputs.discord_bot_version }}
          ENCODER_RECORDER_INPUT: ${{ inputs.encoder_recorder_version }}
          OBSERVABILITY_INPUT: ${{ inputs.observability_version }}
          WORKER_INPUT: ${{ inputs.worker_version }}
        run: |
          set -euo pipefail
          source_version=""
          case "${{ matrix.component.service }}" in
            control-panel) source_version="${CONTROL_PANEL_INPUT}" ;;
            discord-bot) source_version="${DISCORD_BOT_INPUT}" ;;
            encoder-recorder) source_version="${ENCODER_RECORDER_INPUT}" ;;
            observability) source_version="${OBSERVABILITY_INPUT}" ;;
            worker) source_version="${WORKER_INPUT}" ;;
          esac
          if [[ -z "${source_version}" && -f dockerfiles/source-versions.env ]]; then
            # shellcheck disable=SC1091
            source dockerfiles/source-versions.env
            case "${{ matrix.component.service }}" in
              control-panel) source_version="${CONTROL_PANEL_SOURCE_VERSION:-}" ;;
              discord-bot) source_version="${DISCORD_BOT_SOURCE_VERSION:-}" ;;
              encoder-recorder) source_version="${ENCODER_RECORDER_SOURCE_VERSION:-}" ;;
              observability) source_version="${OBSERVABILITY_SOURCE_VERSION:-}" ;;
              worker) source_version="${WORKER_SOURCE_VERSION:-}" ;;
            esac
          fi
          if [[ -z "${source_version}" ]]; then
            source_version="${VERSION}"
          fi
          if [[ "${source_version}" =~ ^v\. ]]; then
            echo "::error::Source version must look like v1.3.0, not ${source_version}. Remove the dot after v." >&2
            exit 1
          fi
          if [[ ! "${source_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Source version must look like v1.3.0; got ${source_version}" >&2
            exit 1
          fi
          echo "source_version=${source_version}" >> "${GITHUB_OUTPUT}"
          echo "Using ${{ matrix.component.repo }} source tag ${source_version} for image ${VERSION} on ${{ matrix.target.platform }}."

      - name: Verify source access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOSTREAM_SOURCE_TOKEN || secrets.GITHUBTOKEN || github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${SOURCE_OWNER}/${{ matrix.component.repo }}" >/dev/null; then
            echo "::error::Cannot access ${SOURCE_OWNER}/${{ matrix.component.repo }}. Set AUTOSTREAM_SOURCE_TOKEN or GITHUBTOKEN with read access to the private source repositories." >&2
            exit 1
          fi
          if ! gh api "repos/${SOURCE_OWNER}/${{ matrix.component.repo }}/git/ref/tags/${{ steps.source_version.outputs.source_version }}" >/dev/null; then
            echo "::error::Missing source tag ${{ steps.source_version.outputs.source_version }} in ${SOURCE_OWNER}/${{ matrix.component.repo }}. If service versions differ, set the matching *_version workflow input or update source-versions.env." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ env.SOURCE_OWNER }}/${{ matrix.component.repo }}
          ref: ${{ steps.source_version.outputs.source_version }}
          path: source/${{ matrix.component.repo }}
          token: ${{ secrets.AUTOSTREAM_SOURCE_TOKEN || secrets.GITHUBTOKEN || github.token }}

      - name: Resolve build metadata
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$(git -C "source/${{ matrix.component.repo }}" rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - uses: useblacksmith/setup-docker-builder@47a5d0102cc44712a17a633c2599f755008cc40e # v1
        with:
          max-cache-size-mb: "10240"

      - name: Login to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN || github.token }}

      - name: Compute image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(printf '%s' "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${namespace}/${{ matrix.component.service }}"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${VERSION}-${{ matrix.target.arch }}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally push
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: source/${{ matrix.component.repo }}
          file: dockerfiles/${{ matrix.component.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: false
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.source_version.outputs.source_version }}
            COMMIT=${{ steps.build_meta.outputs.source_commit }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
          labels: |
            org.opencontainers.image.title=AutoStream ${{ matrix.component.service }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ steps.build_meta.outputs.source_commit }}
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_OWNER }}/${{ matrix.component.repo }}

      - name: Record platform digest
        if: env.PUSH_IMAGES == 'true'
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return an immutable sha256 digest: ${digest}" >&2
            exit 1
          fi
          mkdir -p release-metadata
          jq -n \
            --arg service '${{ matrix.component.service }}' \
            --arg source_version '${{ steps.source_version.outputs.source_version }}' \
            --arg image '${{ steps.image_tags.outputs.image }}' \
            --arg platform '${{ matrix.target.platform }}' \
            --arg digest "${digest}" \
            '{service: $service, source_version: $source_version, image: $image, platform: $platform, digest: $digest}' \
            > 'release-metadata/${{ matrix.component.service }}-${{ matrix.target.arch }}.json'

      - name: Upload platform digest metadata
        if: env.PUSH_IMAGES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metadata-${{ matrix.component.service }}-${{ matrix.target.arch }}
          path: release-metadata/${{ matrix.component.service }}-${{ matrix.target.arch }}.json
          if-no-files-found: error
          retention-days: 7

  publish-manifest:
    name: Publish manifest (${{ matrix.component.service }})
    needs: publish
    if: ${{ github.ref_type == 'tag' || inputs.push_images }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        component:
          - service: control-panel
          - service: discord-bot
          - service: encoder-recorder
          - service: observability
          - service: worker

    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN || github.token }}

      - name: Compute image ref
        id: image_ref
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(printf '%s' "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${namespace}/${{ matrix.component.service }}" >> "${GITHUB_OUTPUT}"

      - name: Download platform digest metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-metadata-${{ matrix.component.service }}-*
          path: image-metadata
          merge-multiple: true

      - name: Validate platform digest metadata
        id: platform_meta
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata_files=(image-metadata/*.json)
          if [[ "${#metadata_files[@]}" -ne 2 ]]; then
            echo "::error::Expected two platform metadata files for ${{ matrix.component.service }}, found ${#metadata_files[@]}." >&2
            exit 1
          fi

          metadata="$(jq -s '.' "${metadata_files[@]}")"
          service='${{ matrix.component.service }}'
          image='${{ steps.image_ref.outputs.image }}'
          jq -e --arg service "${service}" --arg image "${image}" \
            'length == 2 and all(.[]; .service == $service and .image == $image)' \
            <<<"${metadata}" >/dev/null

          source_version="$(jq -er 'map(.source_version) | unique | if length == 1 then .[0] else error("source versions differ between platforms") end' <<<"${metadata}")"
          amd64_digest="$(jq -er '[.[] | select(.platform == "linux/amd64")] | if length == 1 then .[0].digest else error("missing or duplicate linux/amd64 metadata") end' <<<"${metadata}")"
          arm64_digest="$(jq -er '[.[] | select(.platform == "linux/arm64")] | if length == 1 then .[0].digest else error("missing or duplicate linux/arm64 metadata") end' <<<"${metadata}")"
          for digest in "${amd64_digest}" "${arm64_digest}"; do
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid platform digest: ${digest}" >&2
              exit 1
            fi
          done
          {
            echo "source_version=${source_version}"
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish version manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image_ref.outputs.image }}"
          docker buildx imagetools create \
            -t "${image}:${VERSION}" \
            "${image}@${{ steps.platform_meta.outputs.amd64_digest }}" \
            "${image}@${{ steps.platform_meta.outputs.arm64_digest }}"

      - name: Verify published manifest and write component metadata
        id: manifest_meta
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.image_ref.outputs.image }}'
          mkdir -p release-component
          docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' > published-manifest.json
          manifest_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' published-manifest.json)"
          amd64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("published manifest must contain one linux/amd64 image") end' published-manifest.json)"
          arm64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else error("published manifest must contain one linux/arm64 image") end' published-manifest.json)"
          if [[ "${amd64_digest}" != '${{ steps.platform_meta.outputs.amd64_digest }}' ]]; then
            echo "::error::Published linux/amd64 digest does not match the build output." >&2
            exit 1
          fi
          if [[ "${arm64_digest}" != '${{ steps.platform_meta.outputs.arm64_digest }}' ]]; then
            echo "::error::Published linux/arm64 digest does not match the build output." >&2
            exit 1
          fi

          jq -n \
            --arg service '${{ matrix.component.service }}' \
            --arg source_version '${{ steps.platform_meta.outputs.source_version }}' \
            --arg image "${image}:${VERSION}" \
            --arg manifest_digest "${manifest_digest}" \
            --arg amd64_digest "${amd64_digest}" \
            --arg arm64_digest "${arm64_digest}" \
            '{service: $service, source_version: $source_version, image: $image, manifest_digest: $manifest_digest, platform_digests: {"linux/amd64": $amd64_digest, "linux/arm64": $arm64_digest}, rollback_compatible: true, database_schema: (if ($service == "control-panel" or $service == "observability") then "backward_compatible" else "none" end)}' \
            > 'release-component/${{ matrix.component.service }}.json'
          echo "manifest_digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish latest manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            image="${{ steps.image_ref.outputs.image }}"
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${image}:${VERSION}"
          else
            echo "Skipping latest for non-stable version ${VERSION}."
          fi

      - name: Attest multi-platform image provenance
        id: image_attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.image_ref.outputs.image }}
          subject-digest: ${{ steps.manifest_meta.outputs.manifest_digest }}
          subject-version: ${{ env.VERSION }}
          push-to-registry: true

      - name: Report unavailable image attestation
        if: steps.image_attestation.outcome == 'failure'
        shell: bash
        run: echo '::warning::GitHub artifact attestations are unavailable for this repository or plan; the immutable release manifest will still be published.'

      - name: Upload component release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-component-${{ matrix.component.service }}
          path: release-component/${{ matrix.component.service }}.json
          if-no-files-found: error
          retention-days: 7

  release-manifest:
    name: Publish immutable release manifest
    needs: publish-manifest
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout release manifest generator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download component release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-component-*
          path: release-components
          merge-multiple: true

      - name: Generate release-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/generate-release-manifest.py \
            --bundle-version "${VERSION}" \
            --generated-at "${generated_at}" \
            --input-dir release-components \
            --output release-manifest.json \
            --checksum-output release-manifest.json.sha256
          jq -e \
            --arg version "${VERSION}" \
            --arg generated_at "${generated_at}" \
            '(.schema_version == 1) and
             (.channel == "docker") and
             (.release_id == $version) and
             (.bundle_version == $version) and
             (.published_at == $generated_at) and
             (.generated_at == $generated_at) and
             (.minimum_agent_version == "v1.7.0") and
             (.components | length == 5) and
             (all(.components[]; .rollback_compatible == true)) and
             (all(.components[];
               if (.service == "control-panel" or .service == "observability")
               then .database_schema == "backward_compatible"
               else .database_schema == "none"
               end))' \
            release-manifest.json > /dev/null
          sha256sum --check release-manifest.json.sha256

      - name: Upload release manifest workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ env.VERSION }}
          path: |
            release-manifest.json
            release-manifest.json.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Attest release manifest provenance
        id: release_attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-manifest.json
          subject-version: ${{ env.VERSION }}

      - name: Report unavailable release manifest attestation
        if: steps.release_attestation.outcome == 'failure'
        shell: bash
        run: echo '::warning::GitHub artifact attestations are unavailable for this repository or plan; the release manifest remains bound to immutable image digests.'

      - name: Create GitHub Release and attach release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes --title "AutoStream Docker ${VERSION}")
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${VERSION}" \
            'release-manifest.json#AutoStream immutable release manifest' \
            'release-manifest.json.sha256#SHA-256 checksum for the immutable release manifest' \
            "${release_flags[@]}"
