name: Publish GHCR Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Source release tag, for example v1.2.3"
        required: true
        type: string
      source_owner:
        description: "GitHub owner/org containing the AutoStream source repositories"
        required: true
        type: string
      push_images:
        description: "Push images to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  SOURCE_OWNER: ${{ inputs.source_owner || github.repository_owner }}
  PUSH_IMAGES: ${{ github.ref_type == 'tag' || inputs.push_images }}
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/Autostream-Docker

jobs:
  publish:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: control-panel
            repo: Autostream-ControlPanel
            dockerfile: services/control-panel/Dockerfile
          - service: discord-bot
            repo: Autostream-DiscordBot
            dockerfile: services/discord-bot/Dockerfile
          - service: encoder-recorder
            repo: Autostream-Encoder-Recorder
            dockerfile: services/encoder-recorder/Dockerfile
          - service: observability
            repo: Autostream-Observability
            dockerfile: services/observability/Dockerfile
          - service: worker
            repo: Autostream-Worker
            dockerfile: services/worker/Dockerfile

    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3; got ${VERSION}" >&2
            exit 1
          fi

      - name: Checkout Dockerfiles
        uses: actions/checkout@v7
        with:
          path: dockerfiles

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_OWNER }}/${{ matrix.repo }}
          ref: ${{ env.VERSION }}
          path: source/${{ matrix.repo }}
          token: ${{ secrets.AUTOSTREAM_SOURCE_TOKEN || github.token }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Compute image tags
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.service }}"
          {
            echo "tags<<EOF"
            echo "${image}:${VERSION}"
            if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: source/${{ matrix.repo }}
          file: dockerfiles/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AutoStream ${{ matrix.service }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_OWNER }}/${{ matrix.repo }}
